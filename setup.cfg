# Since there is overlap in the violations that the different tools check for, it makes sense to quiesce some warnings 
# in some tools if those warnings in other tools are preferred. This avoids the need to add duplicate lint warnings.

# max-line-length should be removed ASAP!

[pycodestyle]
max-line-length = 180

[flake8]
max-line-length = 180
exclude = umsgpack,.venv,.git,.tox,build,dist,pybitmessage,docs

# pylint honours the [MESSAGES CONTROL] section
# as well as [MASTER] section
[MESSAGES CONTROL]
disable=invalid-name,bare-except,broad-except
# invalid-name: needs fixing during a large, project-wide refactor
# bare-except,broad-except: Need fixing once thorough testing is easier
max-args = 8
max-attributes = 8

[MASTER]
init-hook = import sys;sys.path.append('src')

[tool:pytest]
# Only run core tests by default, excluding Kivy mobile tests and Xvfb-dependent tests
# Note: pybitmessage is a symlink to src, so only use src/tests to avoid duplicate runs
testpaths = src/tests
addopts = 
    --ignore=src/bitmessagekivy/tests
    --ignore=pybitmessage/bitmessagekivy/tests
    -v

[mypy]
mypy_path = src,stubs
exclude = ^pybitmessage|umsgpack|\.venv|\.git|\.tox|build|dist|docs
